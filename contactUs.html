<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>SubletMate - Contact Us</title>
    <meta name="description" content="Contact SubletMate for help finding a verified sublet that matches your needs and budget." />
    <meta name="keywords" content="contact SubletMate, sublet assistance, accommodation help" />
    <meta name="author" content="Yakir Papo & Shir Shmerling" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link rel="icon" href="images/how-book.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="styles/reset.css" rel="stylesheet" />
    <link href="styles/myStyle.css" rel="stylesheet" />
    <script src="jScripts/JavaScript.js" type="text/javascript"></script>
</head>
<body>
<div id="container">
    <header>
        <p class="siteName">SubletMate</p>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sublets.html">Find a Sublet</a></li>
                <li><a href="howItWorks.html">How It Works</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contactUs.html">Contact Us</a></li>
                <li><a href="siteMap.html">Site Map</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <nav id="breadcrumbs">
            <ol>
                <li><a href="index.html">Home</a></li>
                <li>Contact Us</li>
            </ol>
        </nav>
        <section id="contactPage">
            <h1>Contact Us</h1>
            <p class="pageIntroduction">Tell us what you are looking for and we will help you find the right sublet.</p>
            <form id="contactForm">
                <label for="fullName">Full name: *</label>
                <input type="text" id="fullName" name="fullName" required />
                <label for="emailAddress">Email address: *</label>
                <input type="email" id="emailAddress" name="emailAddress" required />
                <label for="arrivalDate">Preferred arrival date:</label>
                <input type="date" id="arrivalDate" name="arrivalDate" />
                <label for="destination">Preferred destination:</label>
                <select id="destination" name="destination">
                    <option value="">Choose a city</option>
                    <option value="telAviv">Tel Aviv</option>
                    <option value="jerusalem">Jerusalem</option>
                    <option value="haifa">Haifa</option>
                </select>
                <p class="formQuestion">How long do you need the sublet?</p>
                <label class="radioLabel">
                <input type="radio" name="stayLength" value="shortStay" />
                Up to one week
                </label>
                <label class="radioLabel">
                 <input type="radio" name="stayLength" value="longStay" />
                 More than one week
                </label>
                <label for="message">Tell us what you are looking for: *</label>
                <textarea id="message" name="message" rows="5" cols="30" required></textarea>
                <label class="checkboxLabel">
                <input type="checkbox" name="updates" value="yes" />
                 I would like to receive updates about new sublets.
                </label>
                <input type="submit" value="Send message" />
            </form>
        </section>
    </main>
    <footer>
        <p>SubletMate</p>
    </footer>
</div>
</body>
</html>
